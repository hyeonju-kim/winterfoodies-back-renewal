############################
# Common config
############################
server:
  port: 8085
  servlet:
    context-path: /
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

logging:
  config: classpath:log/logback.xml
  level:
    org.springframework.jdbc.core: DEBUG
    org.mybatis: DEBUG
    com/winter/winter_back/common/security: debug

############################
# JWT config
############################
jwt:
  secret: ${JWT_SECRET}  # 필수, 로컬은 .env
  expire-time:
    access: 30     # 30분
    refresh: 1440  # 24시간

############################
# Spring config
############################
spring:
  # 로컬 실행 시 프로젝트 루트 .env(git 제외)를 읽어 환경변수처럼 사용. 배포 환경은 실제 환경변수로 주입
  config:
    import: optional:file:.env[.properties]
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: winter_back
  datasource:
    url: ${DB_URL:jdbc:log4jdbc:mariadb://localhost:3307/winter_app?allowPublicKeyRetrieval=true&useSSL=false}  # 기본값 = 로컬 도커 DB
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}  # 필수, 로컬은 .env
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy

  ############################
  ## Spring security
  ############################
  security:
    # Spring Security에서 보안 필터를 완전히 무시할 경로들 (정적 리소스용)
    # 이 경로들은 Spring Security 필터 체인을 아예 거치지 않음
    # 주로 CSS, JS, 이미지 같은 정적 파일들이나 헬스체크용 엔드포인트
    static-contents-url-patterns:
#      /css/sample

    # 인증(로그인) 없이 누구나 접근 가능한 URL 패턴들
    # Spring Security 필터는 거치지만 인증을 요구하지 않음
    # 회원가입, 로그인 페이지, 공개 API 등
    permit-all-url-patterns:
      /login
      ,/user/**
      ,/actuator/**
      ,/categories
      ,/stores/**
      ,/menu/**
      ,/reviews/**
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  cache:
    type: redis



############################
# Custom config
############################
cnf:
  exception:
    path: /exception/exception.yml
  url:
    auto-convert:
      excludes: /static/**,/**/download/**, **/test, /member/**, /metrics