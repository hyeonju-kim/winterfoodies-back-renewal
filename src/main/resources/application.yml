############################
# Common config
############################
server:
  port: 8085
  servlet:
    context-path: /
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

logging:
  config: classpath:log/logback.xml
  level:
    org.springframework.jdbc.core: DEBUG
    org.mybatis: DEBUG
    com/winter/winter_back/common/security: debug

############################
# JWT config
############################
jwt:
  secret: ${JWT_SECRET}  # 필수, 로컬은 .env
  expire-time:
    access: 30     # 30분
    refresh: 1440  # 24시간

############################
# Spring config
############################
spring:
  # 로컬 실행 시 프로젝트 루트 .env(git 제외)를 읽어 환경변수처럼 사용. 배포 환경은 실제 환경변수로 주입
  config:
    import: optional:file:.env[.properties]
  output:
    ansi:
      enabled: ALWAYS
  application:
    name: winter_back
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/winter_app?allowPublicKeyRetrieval=true&useSSL=false}  # 기본값 = 로컬 도커 DB
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}  # 필수, 로컬은 .env
    driver-class-name: org.mariadb.jdbc.Driver

  ############################
  ## Spring security
  ############################
  security:
    # Spring Security에서 보안 필터를 완전히 무시할 경로들 (정적 리소스용)
    # 이 경로들은 Spring Security 필터 체인을 아예 거치지 않음
    # 주로 CSS, JS, 이미지 같은 정적 파일들이나 헬스체크용 엔드포인트
    static-contents-url-patterns:
#      /css/sample

    # 인증(로그인) 없이 접근 가능한 URL 패턴들 (Spring Security 필터는 거치지만 인증을 요구하지 않음)
    # 그 외 경로는 모두 로그인 필요
    # 모든 메서드 허용: 오류 응답 경로, 헬스체크
    permit-all-url-patterns:
      /error
      ,/actuator/health
    # 조회(GET)만 허용: 비로그인 둘러보기용 매장·메뉴·리뷰
    permit-all-get-url-patterns:
      /categories
      ,/stores/**
      ,/menu/**
      ,/home/feed
      ,/reviews/store/**
      ,/reviews/{reviewId:\d+}
    # POST 만 허용: 로그인·토큰 갱신·회원가입
    permit-all-post-url-patterns:
      /login
      ,/auth/refresh
      ,/user/register
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis



############################
# Custom config
############################
cnf:
  exception:
    path: /exception/exception.yml
  url:
    auto-convert:
      excludes: /static/**,/**/download/**, **/test, /member/**, /metrics

############################
# Actuator - 헬스체크만 외부 노출, 상세 정보(DB·Redis 상태 등)는 숨김
############################
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

############################
# CORS - 브라우저에서 호출을 허용할 출처 (쉼표 구분, 패턴 가능)
# 모바일 앱은 Origin 을 보내지 않아 영향 없음. 웹 프론트 배포 시 CORS_ALLOWED_ORIGINS 로 도메인 지정
############################
cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

############################
# SQL 로그 (p6spy)
############################
decorator:
  datasource:
    p6spy:
      # 바인딩 값(비밀번호 해시·연락처 등)까지 찍히므로 기본은 끔. 로컬 .env 에서 SQL_LOG_ENABLED=true 로 켠다
      enable-logging: ${SQL_LOG_ENABLED:false}
      # 기본 포맷은 접속 URL(계정·비밀번호 포함)까지 찍으므로 URL 을 뺀 포맷 사용
      log-format: "took %(executionTime)ms | %(category) | connection %(connectionId)\n%(sql)"
